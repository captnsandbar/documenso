name: Cloudflare image

# Manual only. Builds docker/Dockerfile for linux/amd64 (the only platform
# Cloudflare Containers runs) and pushes it to Cloudflare's registry as
# documenso:<12-char commit sha>. Deploying stays a manual `wrangler deploy`
# of apps/esign in the glasscasa repo, which pins that tag.
#
# Needs the CLOUDFLARE_API_TOKEN secret (Account > Containers > Edit) and the
# CLOUDFLARE_ACCOUNT_ID variable.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-image

jobs:
  build_and_push:
    name: Build and push to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the image
        run: |
          TAG="documenso:$(git rev-parse --short=12 HEAD)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build \
            --platform linux/amd64 \
            -f ./docker/Dockerfile \
            --progress=plain \
            -t "$TAG" \
            .

      - name: Push to Cloudflare's registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.112.0 containers push "$TAG"

      - name: Summary
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SIZE_MB=$(( $(docker image inspect "$TAG" --format '{{.Size}}') / 1048576 ))
          # The image must fit the instance's disk: 4 GB on `basic`.
          if [ "$SIZE_MB" -gt 4000 ]; then
            echo "::warning::Image is ${SIZE_MB} MB, more than the 4 GB disk of the basic instance type."
          fi
          {
            echo "Pushed \`registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${TAG}\`"
            echo
            echo "Image size: ${SIZE_MB} MB (uncompressed)"
          } >> "$GITHUB_STEP_SUMMARY"
